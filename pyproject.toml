[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "care-sequences"
version = "0.1.0"
description = "Séquences synthétiques de soins : références statistiques et Transformer"
requires-python = ">=3.11"
dependencies = ["torch>=2.6,<3", "numpy>=2,<3", "polars>=1.30,<2", "matplotlib>=3.9,<4", "psutil>=7,<8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
care-sequences = "careseq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
